<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добро пожаловать</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
      color: #1a1a2e;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      color: #fff;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 2.4rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .hero p {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .form-card {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .form-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
    }

    .form-card h2 {
      font-size: 1.15rem;
      margin-bottom: 18px;
      color: #4a3f8f;
      padding-bottom: 10px;
      border-bottom: 2px solid #f0f0f5;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 11px 14px;
      font-size: 0.95rem;
      border: 1.5px solid #e0e0e8;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    .field input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .field input:invalid:not(:placeholder-shown) {
      border-color: #e74c3c;
    }

    button {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }

    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }

    .result {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }

    .result.ok {
      display: block;
      background: #e8f8ee;
      color: #1b7a3f;
      border: 1px solid #b8e6c8;
    }

    footer {
      text-align: center;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.85rem;
      margin-top: 30px;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="hero">
    <h1>👋 Добро пожаловать!</h1>
    <p>Заполните формы ниже — мы свяжемся с вами</p>
  </div>

  <!-- ФОРМА 1 -->
  <form class="form-card" data-form="1">
    <h2>Форма 1</h2>
    <div class="field">
      <label>ФИО</label>
      <input type="text" name="fio" placeholder="Иванов Иван Иванович" required minlength="2">
    </div>
    <div class="field">
      <label>Номер телефона</label>
      <input type="tel" name="phone" placeholder="+7 (999) 123-45-67" required pattern="[\d\s\+\-\(\)]{7,20}">
    </div>
    <div class="field">
      <label>Дата рождения</label>
      <input type="date" name="birthdate" required max="2025-12-31">
    </div>
    <button type="submit" >Отправить</button>
    <div class="result"></div>
  </form>
</div>

<script>
  document.querySelectorAll('.form-card').forEach(form => {
    form.addEventListener('submit', async e => {
      e.preventDefault();

      const data = Object.fromEntries(new FormData(form).entries());

      const box = form.querySelector('.result');
      box.className = 'result ok';
      box.textContent = `⏳ Отправка...`;

      try {
        const resp = await fetch('/submit', {                 // ← /submit, не /api/submit
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const json = await resp.json();
        console.log('Ответ сервера:', json);

        box.textContent = `✅ ${data.fio}, спасибо! Данные сохранены.`;
        form.reset();
      } catch (err) {
        console.error(err);
        box.className = 'result';
        box.style.background = '#fdecea';
        box.style.color = '#c0392b';
        box.style.display = 'block';
        box.textContent = '❌ Не удалось отправить: ' + err.message;
      }
    });
  });
</script>

</body>
</html>
